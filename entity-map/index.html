<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entity Map — PDL1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-canvas: #f7f7f9;
      --border-card: #d4d4d7;
      --dot: #e5e6e8;
      --text-sub: #6b6b6d;
      --blue-title: #4a6ef8;
      --blue-selected: #7b92f0;
      --blue-selected-bg: #f5f7ff;
      --blue-icon: #4b78f0;
      --chip: #e2e3e5;
      --edge-parent: #C4D1C2;
      --edge-assoc: #CED2D9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg-canvas);
      -webkit-font-smoothing: antialiased;
    }

    .map {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-canvas);
      background-image: radial-gradient(circle, #d0d1d4 1.6px, transparent 1.8px);
      background-size: 24px 24px;
      background-position: 10px 6px;
      touch-action: none;
    }

    .stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* —— 左上角筛选条 —— */
    .filter-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 6px 10px;
      background: #fff;
      border: 1px solid #e6e6e8;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(16, 16, 20, 0.08);
      font-size: 13px;
      color: #2a2a2e;
      user-select: none;
    }

    .filter-dropdown { position: relative; }

    .filter-trigger {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 8px;
      border: none;
      background: transparent;
      font: inherit;
      color: inherit;
      cursor: pointer;
      border-radius: 4px;
      white-space: nowrap;
    }

    .filter-trigger:hover { background: #f3f4f6; }
    .filter-trigger svg { width: 12px; height: 12px; color: #6b6b6f; flex-shrink: 0; }

    .filter-menu {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 132px;
      padding: 4px;
      background: #fff;
      border: 1px solid #e6e6e8;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(16, 16, 20, 0.12);
      z-index: 50;
    }

    .filter-menu.open { display: block; }

    .filter-option {
      display: block;
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border: none;
      background: transparent;
      font: inherit;
      color: #2a2a2e;
      border-radius: 5px;
      cursor: pointer;
    }

    .filter-option:hover { background: #f3f4f6; }
    .filter-option.active {
      color: #3b5bdb;
      background: #eef2ff;
      font-weight: 600;
    }

    .filter-divider {
      width: 1px;
      height: 20px;
      background: #e6e6e8;
      flex-shrink: 0;
    }

    .filter-tags {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 26px;
      padding: 0 6px 0 10px;
      background: #f1f3f5;
      border-radius: 4px;
      font-size: 12px;
      color: #3c3c40;
      white-space: nowrap;
    }

    .filter-tag button {
      width: 16px;
      height: 16px;
      border: none;
      background: transparent;
      color: #8a8a8e;
      cursor: pointer;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      line-height: 1;
      padding: 0;
    }

    .filter-tag button:hover {
      background: #e2e4e8;
      color: #2a2a2e;
    }

    .filter-more {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      margin-left: 2px;
      border: none;
      background: transparent;
      color: #5a5a5e;
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
    }

    .filter-more:hover {
      background: #f3f4f6;
      color: #2a2a2e;
    }

    .filter-more svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .edges {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
      z-index: 5;
    }

    .edges path.line {
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
    }

    .edges path.line.parent { stroke: var(--edge-parent); }
    .edges path.line.assoc {
      stroke: var(--edge-assoc);
      stroke-dasharray: 5 4;
      stroke-width: 1.5;
    }

    .edges path.arrow.parent { fill: var(--edge-parent); stroke: none; }
    .edges path.arrow.assoc { fill: var(--edge-assoc); stroke: none; }

    .node {
      position: absolute;
      background: #fff;
      border: 1px solid var(--border-card);
      border-radius: 4px;
      padding: 8px 9px 9px;
      box-shadow: 0 1px 2px rgba(16, 16, 20, 0.05);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 7px;
      z-index: 2;
      cursor: grab;
      user-select: none;
      min-width: 168px;
      touch-action: none;
    }

    .node.hidden { display: none; }

    .node:active,
    .node.dragging {
      cursor: grabbing;
      z-index: 20;
      box-shadow: 0 6px 18px rgba(16, 16, 20, 0.14);
    }

    .node.selected {
      border-color: var(--blue-selected);
      background: var(--blue-selected-bg);
      box-shadow: 0 0 0 0.5px rgba(72, 111, 251, 0.25);
    }

    .node.selected.dragging {
      box-shadow: 0 6px 18px rgba(72, 111, 251, 0.22);
    }

    .node-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      align-self: stretch;
      background: var(--chip);
      border-radius: 3px;
      padding: 3px 8px 3px 5px;
      min-height: 22px;
      max-width: 100%;
    }

    .node.selected .node-chip { background: #dfe3ec; }

    .node-chip .icon {
      flex-shrink: 0;
      width: 13px;
      height: 13px;
      color: var(--blue-icon);
      display: block;
    }

    .node-id {
      font-size: 12px;
      font-weight: 600;
      color: var(--blue-title);
      line-height: 1.15;
      white-space: nowrap;
    }

    .node-type {
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.15;
      padding-left: 1px;
      white-space: nowrap;
    }

    .zoom-bar {
      position: absolute;
      left: 26px;
      bottom: 26px;
      display: flex;
      align-items: center;
      height: 40px;
      background: #fff;
      border: 1px solid #e4e4e6;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      z-index: 30;
    }

    .zoom-group { display: flex; align-items: center; height: 100%; }

    .zoom-btn {
      width: 34px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: #2c2c30;
      cursor: pointer;
      padding: 0;
    }

    .zoom-btn:hover { background: #f3f4f6; }
    .zoom-btn:active { background: #ebebef; }

    .zoom-pct {
      min-width: 42px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: #1b1b1d;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    .zoom-divider {
      width: 1px;
      height: 22px;
      background: #e6e6e8;
      margin: 0 2px;
    }

    .edge-legend {
      position: absolute;
      right: 26px;
      bottom: 26px;
      z-index: 30;
      display: flex;
      align-items: stretch;
      gap: 28px;
      padding: 14px 22px 12px;
      background: #fff;
      border: 1px solid #e6e6e8;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(16, 16, 20, 0.08);
      user-select: none;
    }

    .legend-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-width: 72px;
    }

    .legend-line {
      width: 56px;
      height: 14px;
      display: block;
    }

    .legend-item span {
      font-size: 12px;
      color: #5a5a5e;
      line-height: 1;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="map" id="map">
    <div class="stage" id="stage">
      <svg class="edges" id="edges" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <div class="filter-bar" id="filter-bar">
      <div class="filter-dropdown" id="relation-dropdown">
        <button class="filter-trigger" type="button" id="relation-trigger">
          <span id="relation-label">全部关系</span>
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
        </button>
        <div class="filter-menu" id="relation-menu">
          <button class="filter-option active" type="button" data-value="all">全部关系</button>
          <button class="filter-option" type="button" data-value="parent">父子关系</button>
          <button class="filter-option" type="button" data-value="assoc">关联关系</button>
        </div>
      </div>

      <div class="filter-divider"></div>

      <div class="filter-tags" id="round-tags"></div>

      <div class="filter-dropdown" id="round-dropdown">
        <button class="filter-trigger" type="button" id="round-trigger" aria-label="轮次筛选">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
        </button>
        <div class="filter-menu" id="round-menu">
          <button class="filter-option" type="button" data-round="第一轮">第一轮</button>
          <button class="filter-option" type="button" data-round="第二轮">第二轮</button>
        </div>
      </div>

      <button class="filter-more" type="button" id="filter-more" title="更多筛选" aria-label="更多筛选">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 3.5h12"/>
          <path d="M4 8h8"/>
          <path d="M6.5 12.5h3"/>
          <circle cx="5.5" cy="3.5" r="1.35" fill="currentColor" stroke="none"/>
          <circle cx="10" cy="8" r="1.35" fill="currentColor" stroke="none"/>
          <circle cx="8" cy="12.5" r="1.35" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </div>

    <div class="zoom-bar">
      <div class="zoom-group">
        <button class="zoom-btn" type="button" id="zoom-out" aria-label="缩小">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 7h8"/></svg>
        </button>
        <span class="zoom-pct" id="zoom-pct">61%</span>
        <button class="zoom-btn" type="button" id="zoom-in" aria-label="放大">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 3v8M3 7h8"/></svg>
        </button>
      </div>
      <div class="zoom-divider"></div>
      <div class="zoom-group">
        <button class="zoom-btn" type="button" id="zoom-fit" aria-label="适应画布">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 5.5V2h3.5M13 5.5V2H9.5M2 9.5V13h3.5M13 9.5V13H9.5"/>
          </svg>
        </button>
        <button class="zoom-btn" type="button" id="zoom-center" aria-label="居中">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round">
            <circle cx="8" cy="8" r="3.4"/>
            <circle cx="8" cy="8" r="1" fill="currentColor" stroke="none"/>
            <path d="M8 1.25v2M8 12.75v2M1.25 8h2M12.75 8h2"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="edge-legend" aria-label="连线示意图">
      <div class="legend-item">
        <svg class="legend-line" viewBox="0 0 56 14" aria-hidden="true">
          <line x1="2" y1="7" x2="42" y2="7" stroke="#C4D1C2" stroke-width="2" stroke-linecap="round"/>
          <path d="M40 2.5 L52 7 L40 11.5 Z" fill="#C4D1C2"/>
        </svg>
        <span>父子关系</span>
      </div>
      <div class="legend-item">
        <svg class="legend-line" viewBox="0 0 56 14" aria-hidden="true">
          <line x1="2" y1="7" x2="42" y2="7" stroke="#CED2D9" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"/>
          <path d="M40 2.5 L52 7 L40 11.5 Z" fill="#CED2D9"/>
        </svg>
        <span>关联关系</span>
      </div>
    </div>
  </div>

  <script>
    const ICON_Y = `
      <svg class="icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 12.2V7"/>
        <path d="M7 7L3.4 2.9"/>
        <path d="M7 7L10.6 2.9"/>
        <path d="M5.3 12.2h3.4"/>
      </svg>`;

    // 世界坐标（逻辑像素，缩放前）
    const nodes = [
      { id: "root", label: "PDL1-WT01", sub: "", round: null, x: 80, y: 360, selected: true },
      { id: "r1a", label: "CAND-PDL1-001", sub: "轮次/阶段：第一轮", round: "第一轮", x: 420, y: 140 },
      { id: "r1b", label: "CAND-PDL1-002", sub: "轮次/阶段：第一轮", round: "第一轮", x: 420, y: 320 },
      { id: "r1c", label: "CAND-PDL1-003", sub: "轮次/阶段：第一轮", round: "第一轮", x: 420, y: 500 },
      { id: "r2a", label: "CAND-PDL1-004", sub: "轮次/阶段：第二轮", round: "第二轮", x: 780, y: 140 },
      { id: "r2b", label: "CAND-PDL1-005", sub: "轮次/阶段：第二轮", round: "第二轮", x: 780, y: 320 },
      { id: "r2c", label: "CAND-PDL1-006", sub: "轮次/阶段：第二轮", round: "第二轮", x: 780, y: 500 },
    ];

    const edges = [
      { from: "root", to: "r1a", type: "parent" },
      { from: "root", to: "r1b", type: "parent" },
      { from: "root", to: "r1c", type: "parent" },
      { from: "root", to: "r2a", type: "parent" },
      { from: "root", to: "r2b", type: "parent" },
      { from: "root", to: "r2c", type: "parent" },
      { from: "r1a", to: "r2a", type: "assoc" },
      { from: "r1a", to: "r2b", type: "assoc" },
      { from: "r1b", to: "r2c", type: "assoc" },
    ];

    const RELATION_LABELS = {
      all: "全部关系",
      parent: "父子关系",
      assoc: "关联关系",
    };

    const filters = {
      relation: "all",
      rounds: new Set(["第一轮", "第二轮"]),
    };

    const view = {
      scale: 0.61,
      panX: 40,
      panY: 40,
      min: 0.25,
      max: 2,
      step: 0.1,
    };

    const map = document.getElementById("map");
    const stage = document.getElementById("stage");
    const svg = document.getElementById("edges");
    const zoomPctEl = document.getElementById("zoom-pct");
    const nodeEls = {};
    const ARROW_SIZE = 9;

    function applyViewTransform() {
      stage.style.transform = `translate(${view.panX}px, ${view.panY}px) scale(${view.scale})`;
      zoomPctEl.textContent = Math.round(view.scale * 100) + "%";
    }

    function setZoom(next, anchorClientX, anchorClientY) {
      const prev = view.scale;
      const scale = Math.min(view.max, Math.max(view.min, next));
      if (scale === prev) {
        zoomPctEl.textContent = Math.round(scale * 100) + "%";
        return;
      }

      const rect = map.getBoundingClientRect();
      const ax = (anchorClientX ?? rect.left + rect.width / 2) - rect.left;
      const ay = (anchorClientY ?? rect.top + rect.height / 2) - rect.top;

      // 锚点下的世界坐标保持不变
      const worldX = (ax - view.panX) / prev;
      const worldY = (ay - view.panY) / prev;
      view.scale = scale;
      view.panX = ax - worldX * scale;
      view.panY = ay - worldY * scale;
      applyViewTransform();
    }

    function getContentBounds() {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      let any = false;
      nodes.forEach((n) => {
        if (!isNodeVisible(n)) return;
        const el = nodeEls[n.id];
        if (!el) return;
        any = true;
        const w = el.offsetWidth;
        const h = el.offsetHeight;
        minX = Math.min(minX, n.x);
        minY = Math.min(minY, n.y);
        maxX = Math.max(maxX, n.x + w);
        maxY = Math.max(maxY, n.y + h);
      });
      if (!any) return null;
      return { minX, minY, maxX, maxY, width: maxX - minX, height: maxY - minY };
    }

    function fitView() {
      const bounds = getContentBounds();
      if (!bounds) return;
      const pad = 80;
      const vw = map.clientWidth;
      const vh = map.clientHeight;
      const scale = Math.min(
        view.max,
        Math.max(view.min, Math.min((vw - pad * 2) / bounds.width, (vh - pad * 2) / bounds.height))
      );
      view.scale = scale;
      view.panX = (vw - bounds.width * scale) / 2 - bounds.minX * scale;
      view.panY = (vh - bounds.height * scale) / 2 - bounds.minY * scale;
      applyViewTransform();
    }

    function centerView() {
      const bounds = getContentBounds();
      if (!bounds) return;
      const cx = (bounds.minX + bounds.maxX) / 2;
      const cy = (bounds.minY + bounds.maxY) / 2;
      view.panX = map.clientWidth / 2 - cx * view.scale;
      view.panY = map.clientHeight / 2 - cy * view.scale;
      applyViewTransform();
    }

    function setupZoomControls() {
      document.getElementById("zoom-in").addEventListener("click", () => {
        setZoom(view.scale + view.step);
      });
      document.getElementById("zoom-out").addEventListener("click", () => {
        setZoom(view.scale - view.step);
      });
      document.getElementById("zoom-fit").addEventListener("click", fitView);
      document.getElementById("zoom-center").addEventListener("click", centerView);

      // 滚轮缩放（以鼠标位置为锚点）
      map.addEventListener("wheel", (ev) => {
        if (ev.target.closest(".filter-bar, .zoom-bar, .edge-legend")) return;
        ev.preventDefault();
        const delta = ev.deltaY > 0 ? -view.step : view.step;
        setZoom(view.scale + delta, ev.clientX, ev.clientY);
      }, { passive: false });
    }

    function renderNodes() {
      nodes.forEach((n) => {
        const el = document.createElement("div");
        el.className = "node" + (n.selected ? " selected" : "");
        el.id = "node-" + n.id;
        el.dataset.id = n.id;
        el.style.left = n.x + "px";
        el.style.top = n.y + "px";
        el.innerHTML = `
          <div class="node-chip">${ICON_Y}<span class="node-id">${n.label}</span></div>
          ${n.sub ? `<div class="node-type">${n.sub}</div>` : ""}
        `;
        stage.appendChild(el);
        nodeEls[n.id] = el;
        enableDrag(el, n);
      });
    }

    function isNodeVisible(n) {
      if (!n.round) return true;
      return filters.rounds.has(n.round);
    }

    function applyFilters() {
      nodes.forEach((n) => {
        const el = nodeEls[n.id];
        if (!el) return;
        el.classList.toggle("hidden", !isNodeVisible(n));
      });
      drawEdges();
      renderRoundTags();
    }

    function port(el, side) {
      // stage 本地坐标（不受缩放影响）
      const y = el.offsetTop + el.offsetHeight / 2;
      const x = side === "right" ? el.offsetLeft + el.offsetWidth : el.offsetLeft;
      return { x, y };
    }

    function curve(a, b) {
      const dx = Math.max(48, (b.x - a.x) * 0.48);
      return `M ${a.x} ${a.y} C ${a.x + dx} ${a.y}, ${b.x - dx} ${b.y}, ${b.x} ${b.y}`;
    }

    function alongBack(a, tip, length) {
      const dx = tip.x - a.x;
      const dy = tip.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      return {
        x: tip.x - (dx / len) * length,
        y: tip.y - (dy / len) * length,
      };
    }

    function arrowPath(a, tip, size) {
      const base = alongBack(a, tip, size);
      const dx = tip.x - a.x;
      const dy = tip.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      const px = (-dy / len) * size * 0.55;
      const py = (dx / len) * size * 0.55;
      return `M ${tip.x} ${tip.y} L ${base.x + px} ${base.y + py} L ${base.x - px} ${base.y - py} Z`;
    }

    function drawEdges() {
      // stage 足够大，覆盖节点世界坐标范围
      const bounds = getContentBounds() || { minX: 0, minY: 0, maxX: 1200, maxY: 800 };
      const pad = 400;
      const w = Math.max(map.clientWidth / view.scale + 800, bounds.maxX + pad);
      const h = Math.max(map.clientHeight / view.scale + 800, bounds.maxY + pad);
      svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
      svg.setAttribute("width", w);
      svg.setAttribute("height", h);

      const parts = [];
      edges.forEach((e) => {
        if (filters.relation !== "all" && e.type !== filters.relation) return;

        const fromNode = nodes.find((n) => n.id === e.from);
        const toNode = nodes.find((n) => n.id === e.to);
        if (!isNodeVisible(fromNode) || !isNodeVisible(toNode)) return;

        const fromEl = nodeEls[e.from];
        const toEl = nodeEls[e.to];
        if (!fromEl || !toEl || fromEl.classList.contains("hidden") || toEl.classList.contains("hidden")) return;

        const from = port(fromEl, "right");
        const tip = port(toEl, "left");
        const lineEnd = alongBack(from, tip, ARROW_SIZE - 1);
        const cls = e.type === "assoc" ? "assoc" : "parent";

        parts.push(`<path class="line ${cls}" d="${curve(from, lineEnd)}" />`);
        parts.push(`<path class="arrow ${cls}" d="${arrowPath(from, tip, ARROW_SIZE)}" />`);
      });

      svg.innerHTML = parts.join("");
    }

    function renderRoundTags() {
      const wrap = document.getElementById("round-tags");
      wrap.innerHTML = ["第一轮", "第二轮"]
        .filter((r) => filters.rounds.has(r))
        .map((r) => `
          <span class="filter-tag" data-round="${r}">
            ${r}
            <button type="button" data-remove="${r}" aria-label="移除 ${r}">×</button>
          </span>
        `).join("");

      wrap.querySelectorAll("[data-remove]").forEach((btn) => {
        btn.addEventListener("click", (ev) => {
          ev.stopPropagation();
          filters.rounds.delete(btn.dataset.remove);
          applyFilters();
        });
      });

      document.querySelectorAll("#round-menu .filter-option").forEach((opt) => {
        opt.classList.toggle("active", filters.rounds.has(opt.dataset.round));
      });
    }

    function setupFilters() {
      const relationTrigger = document.getElementById("relation-trigger");
      const relationMenu = document.getElementById("relation-menu");
      const relationLabel = document.getElementById("relation-label");
      const roundTrigger = document.getElementById("round-trigger");
      const roundMenu = document.getElementById("round-menu");

      relationTrigger.addEventListener("click", (ev) => {
        ev.stopPropagation();
        relationMenu.classList.toggle("open");
        roundMenu.classList.remove("open");
      });

      roundTrigger.addEventListener("click", (ev) => {
        ev.stopPropagation();
        roundMenu.classList.toggle("open");
        relationMenu.classList.remove("open");
      });

      relationMenu.querySelectorAll(".filter-option").forEach((opt) => {
        opt.addEventListener("click", () => {
          filters.relation = opt.dataset.value;
          relationLabel.textContent = RELATION_LABELS[filters.relation];
          relationMenu.querySelectorAll(".filter-option").forEach((o) => {
            o.classList.toggle("active", o.dataset.value === filters.relation);
          });
          relationMenu.classList.remove("open");
          drawEdges();
        });
      });

      roundMenu.querySelectorAll(".filter-option").forEach((opt) => {
        opt.addEventListener("click", () => {
          const r = opt.dataset.round;
          if (filters.rounds.has(r)) filters.rounds.delete(r);
          else filters.rounds.add(r);
          applyFilters();
        });
      });

      document.addEventListener("click", () => {
        relationMenu.classList.remove("open");
        roundMenu.classList.remove("open");
      });

      document.getElementById("filter-bar").addEventListener("click", (ev) => {
        ev.stopPropagation();
      });

      renderRoundTags();
    }

    function enableDrag(el, data) {
      let dragging = false;
      let startX = 0;
      let startY = 0;
      let originX = 0;
      let originY = 0;

      const onPointerDown = (ev) => {
        if (ev.button !== undefined && ev.button !== 0) return;
        dragging = true;
        el.classList.add("dragging");
        el.setPointerCapture(ev.pointerId);
        startX = ev.clientX;
        startY = ev.clientY;
        originX = data.x;
        originY = data.y;
        ev.preventDefault();
        ev.stopPropagation();
      };

      const onPointerMove = (ev) => {
        if (!dragging) return;
        // 屏幕位移换算成世界坐标位移
        const dx = (ev.clientX - startX) / view.scale;
        const dy = (ev.clientY - startY) / view.scale;
        data.x = originX + dx;
        data.y = originY + dy;
        el.style.left = data.x + "px";
        el.style.top = data.y + "px";
        drawEdges();
      };

      const onPointerUp = (ev) => {
        if (!dragging) return;
        dragging = false;
        el.classList.remove("dragging");
        try { el.releasePointerCapture(ev.pointerId); } catch (_) {}
        drawEdges();
      };

      el.addEventListener("pointerdown", onPointerDown);
      el.addEventListener("pointermove", onPointerMove);
      el.addEventListener("pointerup", onPointerUp);
      el.addEventListener("pointercancel", onPointerUp);
    }

    // 空白处拖动画布平移
    function setupPan() {
      let panning = false;
      let sx = 0, sy = 0, ox = 0, oy = 0;

      map.addEventListener("pointerdown", (ev) => {
        if (ev.button !== 0) return;
        if (ev.target.closest(".node, .filter-bar, .zoom-bar, .edge-legend, .filter-menu")) return;
        panning = true;
        map.setPointerCapture(ev.pointerId);
        sx = ev.clientX;
        sy = ev.clientY;
        ox = view.panX;
        oy = view.panY;
        map.style.cursor = "grabbing";
      });

      map.addEventListener("pointermove", (ev) => {
        if (!panning) return;
        view.panX = ox + (ev.clientX - sx);
        view.panY = oy + (ev.clientY - sy);
        applyViewTransform();
      });

      const endPan = (ev) => {
        if (!panning) return;
        panning = false;
        map.style.cursor = "";
        try { map.releasePointerCapture(ev.pointerId); } catch (_) {}
      };

      map.addEventListener("pointerup", endPan);
      map.addEventListener("pointercancel", endPan);
    }

    renderNodes();
    setupFilters();
    setupZoomControls();
    setupPan();
    applyViewTransform();
    window.addEventListener("resize", () => {
      drawEdges();
    });
    window.addEventListener("load", () => {
      drawEdges();
    });
    requestAnimationFrame(() => {
      drawEdges();
    });
  </script>
</body>
</html>
