<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entity Map — PDL1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-canvas: #f7f7f9;
      --border-card: #d4d4d7;
      --dot: #e5e6e8;
      --text-sub: #6b6b6d;
      --blue-title: #4a6ef8;
      --blue-selected: #7b92f0;
      --blue-selected-bg: #f5f7ff;
      --blue-icon: #4b78f0;
      --chip: #e2e3e5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg-canvas);
      -webkit-font-smoothing: antialiased;
    }

    .map {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-canvas);
      background-image: radial-gradient(circle, var(--dot) 1.15px, transparent 1.25px);
      background-size: 24px 24px;
      background-position: 10px 6px;
      touch-action: none;
    }

    .edges {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
      z-index: 1;
    }

    .edges path {
      fill: none;
      stroke-width: 1.5;
    }

    .edges path.parent {
      stroke: #C4D1C2;
    }

    .edges path.assoc {
      stroke: #CED2D9;
      stroke-dasharray: 5 4;
      stroke-width: 1.4;
    }

    .node {
      position: absolute;
      background: #fff;
      border: 1px solid var(--border-card);
      border-radius: 4px;
      padding: 8px 9px 9px;
      box-shadow: 0 1px 2px rgba(16, 16, 20, 0.05);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 7px;
      z-index: 2;
      cursor: grab;
      user-select: none;
      min-width: 168px;
      touch-action: none;
    }

    .node:active,
    .node.dragging {
      cursor: grabbing;
      z-index: 20;
      box-shadow: 0 6px 18px rgba(16, 16, 20, 0.14);
    }

    .node.selected {
      border-color: var(--blue-selected);
      background: var(--blue-selected-bg);
      box-shadow: 0 0 0 0.5px rgba(72, 111, 251, 0.25);
    }

    .node.selected.dragging {
      box-shadow: 0 6px 18px rgba(72, 111, 251, 0.22);
    }

    .node-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      align-self: stretch;
      background: var(--chip);
      border-radius: 3px;
      padding: 3px 8px 3px 5px;
      min-height: 22px;
      max-width: 100%;
    }

    .node.selected .node-chip { background: #dfe3ec; }

    .node-chip .icon {
      flex-shrink: 0;
      width: 13px;
      height: 13px;
      color: var(--blue-icon);
      display: block;
    }

    .node-id {
      font-size: 12px;
      font-weight: 600;
      color: var(--blue-title);
      line-height: 1.15;
      white-space: nowrap;
    }

    .node-type {
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.15;
      padding-left: 1px;
      white-space: nowrap;
    }

    .zoom-bar {
      position: absolute;
      left: 26px;
      bottom: 26px;
      display: flex;
      align-items: center;
      height: 40px;
      background: #fff;
      border: 1px solid #e4e4e6;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      z-index: 30;
    }

    .zoom-group { display: flex; align-items: center; height: 100%; }

    .zoom-btn {
      width: 34px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: #2c2c30;
      cursor: default;
      padding: 0;
    }

    .zoom-pct {
      min-width: 38px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: #1b1b1d;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    .zoom-divider {
      width: 1px;
      height: 22px;
      background: #e6e6e8;
      margin: 0 2px;
    }
  </style>
</head>
<body>
  <div class="map" id="map">
    <svg class="edges" id="edges" xmlns="http://www.w3.org/2000/svg"></svg>

    <div class="zoom-bar">
      <div class="zoom-group">
        <button class="zoom-btn" type="button" aria-label="Zoom out">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 7h8"/></svg>
        </button>
        <span class="zoom-pct">61%</span>
        <button class="zoom-btn" type="button" aria-label="Zoom in">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 3v8M3 7h8"/></svg>
        </button>
      </div>
      <div class="zoom-divider"></div>
      <div class="zoom-group">
        <button class="zoom-btn" type="button" aria-label="Fit">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 5.5V2h3.5M13 5.5V2H9.5M2 9.5V13h3.5M13 9.5V13H9.5"/>
          </svg>
        </button>
        <button class="zoom-btn" type="button" aria-label="Recenter">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round">
            <circle cx="8" cy="8" r="3.4"/>
            <circle cx="8" cy="8" r="1" fill="currentColor" stroke="none"/>
            <path d="M8 1.25v2M8 12.75v2M1.25 8h2M12.75 8h2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const ICON_Y = `
      <svg class="icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 12.2V7"/>
        <path d="M7 7L3.4 2.9"/>
        <path d="M7 7L10.6 2.9"/>
        <path d="M5.3 12.2h3.4"/>
      </svg>`;

    const nodes = [
      { id: "root", label: "PDL1-WT01", sub: "", xPct: 6, yPct: 48, selected: true },
      { id: "r1a", label: "CAND-PDL1-001", sub: "轮次/阶段：第一轮", xPct: 38, yPct: 18 },
      { id: "r1b", label: "CAND-PDL1-002", sub: "轮次/阶段：第一轮", xPct: 38, yPct: 42 },
      { id: "r1c", label: "CAND-PDL1-003", sub: "轮次/阶段：第一轮", xPct: 38, yPct: 66 },
      { id: "r2a", label: "CAND-PDL1-004", sub: "轮次/阶段：第二轮", xPct: 72, yPct: 18 },
      { id: "r2b", label: "CAND-PDL1-005", sub: "轮次/阶段：第二轮", xPct: 72, yPct: 42 },
      { id: "r2c", label: "CAND-PDL1-006", sub: "轮次/阶段：第二轮", xPct: 72, yPct: 66 },
    ];

    const edges = [
      // 父级关系：PDL1-WT01 → 其余全部
      { from: "root", to: "r1a", type: "parent" },
      { from: "root", to: "r1b", type: "parent" },
      { from: "root", to: "r1c", type: "parent" },
      { from: "root", to: "r2a", type: "parent" },
      { from: "root", to: "r2b", type: "parent" },
      { from: "root", to: "r2c", type: "parent" },
      // 关联关系：虚线
      { from: "r1a", to: "r2a", type: "assoc" }, // 001 → 004
      { from: "r1a", to: "r2b", type: "assoc" }, // 001 → 005
      { from: "r1b", to: "r2c", type: "assoc" }, // 002 → 006
    ];

    const map = document.getElementById("map");
    const svg = document.getElementById("edges");
    const nodeEls = {};

    function renderNodes() {
      nodes.forEach((n) => {
        const el = document.createElement("div");
        el.className = "node" + (n.selected ? " selected" : "");
        el.id = "node-" + n.id;
        el.dataset.id = n.id;
        el.style.left = n.xPct + "%";
        el.style.top = n.yPct + "%";
        el.innerHTML = `
          <div class="node-chip">${ICON_Y}<span class="node-id">${n.label}</span></div>
          ${n.sub ? `<div class="node-type">${n.sub}</div>` : ""}
        `;
        map.insertBefore(el, map.querySelector(".zoom-bar"));
        nodeEls[n.id] = el;
        enableDrag(el, n);
      });
    }

    function port(el, side) {
      const mr = map.getBoundingClientRect();
      const r = el.getBoundingClientRect();
      const y = r.top - mr.top + r.height / 2;
      return side === "right"
        ? { x: r.right - mr.left, y }
        : { x: r.left - mr.left, y };
    }

    function curve(a, b) {
      const dx = Math.max(48, (b.x - a.x) * 0.48);
      return `M ${a.x} ${a.y} C ${a.x + dx} ${a.y}, ${b.x - dx} ${b.y}, ${b.x} ${b.y}`;
    }

    function drawEdges() {
      const w = map.clientWidth;
      const h = map.clientHeight;
      svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
      svg.setAttribute("width", w);
      svg.setAttribute("height", h);

      const defs = `
        <defs>
          <marker id="arrow-parent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#C4D1C2" />
          </marker>
          <marker id="arrow-assoc" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#CED2D9" />
          </marker>
        </defs>`;

      const paths = edges.map((e) => {
        const from = port(nodeEls[e.from], "right");
        const to = port(nodeEls[e.to], "left");
        // 终点略微左移，避免箭头埋进节点边框
        to.x -= 1;
        const cls = e.type === "assoc" ? "assoc" : "parent";
        const marker = e.type === "assoc" ? "arrow-assoc" : "arrow-parent";
        return `<path class="${cls}" d="${curve(from, to)}" marker-end="url(#${marker})" />`;
      }).join("");

      svg.innerHTML = defs + paths;
    }

    function enableDrag(el, data) {
      let dragging = false;
      let startX = 0;
      let startY = 0;
      let originLeft = 0;
      let originTop = 0;

      const onPointerDown = (ev) => {
        if (ev.button !== undefined && ev.button !== 0) return;
        dragging = true;
        el.classList.add("dragging");
        el.setPointerCapture(ev.pointerId);
        startX = ev.clientX;
        startY = ev.clientY;
        originLeft = el.offsetLeft;
        originTop = el.offsetTop;
        el.style.left = originLeft + "px";
        el.style.top = originTop + "px";
        ev.preventDefault();
      };

      const onPointerMove = (ev) => {
        if (!dragging) return;
        const dx = ev.clientX - startX;
        const dy = ev.clientY - startY;
        const mr = map.getBoundingClientRect();
        let left = originLeft + dx;
        let top = originTop + dy;
        const maxL = Math.max(0, mr.width - el.offsetWidth);
        const maxT = Math.max(0, mr.height - el.offsetHeight);
        left = Math.min(Math.max(0, left), maxL);
        top = Math.min(Math.max(0, top), maxT);
        el.style.left = left + "px";
        el.style.top = top + "px";
        data.xPct = (left / mr.width) * 100;
        data.yPct = (top / mr.height) * 100;
        drawEdges();
      };

      const onPointerUp = (ev) => {
        if (!dragging) return;
        dragging = false;
        el.classList.remove("dragging");
        try { el.releasePointerCapture(ev.pointerId); } catch (_) {}
        drawEdges();
      };

      el.addEventListener("pointerdown", onPointerDown);
      el.addEventListener("pointermove", onPointerMove);
      el.addEventListener("pointerup", onPointerUp);
      el.addEventListener("pointercancel", onPointerUp);
    }

    renderNodes();
    window.addEventListener("resize", drawEdges);
    window.addEventListener("load", drawEdges);
    requestAnimationFrame(drawEdges);
  </script>
</body>
</html>
