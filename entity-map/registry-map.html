<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>注册关系图 — 抗体研发谱系</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-canvas: #f7f7f9;
      --border-card: #d4d4d7;
      --text-sub: #6b6b6d;
      --blue-title: #4a6ef8;
      --blue-selected: #7b92f0;
      --blue-selected-bg: #f5f7ff;
      --blue-icon: #4b78f0;
      --chip: #e2e3e5;
      --edge-parent: #C4D1C2;
      --edge-assoc: #CED2D9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%; overflow: hidden;
      font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg-canvas); -webkit-font-smoothing: antialiased;
    }
    .map {
      position: relative; width: 100%; height: 100%; overflow: hidden;
      background-color: var(--bg-canvas);
      background-image: radial-gradient(circle, #d5d6d9 1.05px, transparent 1.2px);
      background-size: 22px 22px; background-position: 8px 6px; touch-action: none;
    }
    .map:fullscreen, .map:-webkit-full-screen {
      width: 100vw; height: 100vh;
      background-color: var(--bg-canvas);
      background-image: radial-gradient(circle, #d5d6d9 1.05px, transparent 1.2px);
      background-size: 22px 22px; background-position: 8px 6px;
    }
    .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    .filter-bar {
      position: absolute; top: 16px; left: 16px; z-index: 40;
      display: flex; align-items: center; gap: 8px; min-height: 40px;
      padding: 6px 10px; background: #fff; border: 1px solid #e6e6e8;
      border-radius: 8px; box-shadow: 0 2px 8px rgba(16,16,20,.08);
      font-size: 13px; color: #2a2a2e; user-select: none;
    }
    .filter-dropdown { position: relative; }
    .filter-trigger {
      display: inline-flex; align-items: center; gap: 6px; height: 28px;
      padding: 0 8px; border: none; background: transparent; font: inherit;
      color: inherit; cursor: pointer; border-radius: 4px; white-space: nowrap;
    }
    .filter-trigger:hover { background: #f3f4f6; }
    .filter-trigger svg { width: 12px; height: 12px; color: #6b6b6f; flex-shrink: 0; }
    .filter-menu {
      display: none; position: absolute; top: calc(100% + 6px); left: 0;
      min-width: 132px; padding: 4px; background: #fff; border: 1px solid #e6e6e8;
      border-radius: 8px; box-shadow: 0 6px 18px rgba(16,16,20,.12); z-index: 50;
    }
    .filter-menu.open { display: block; }
    .filter-option {
      display: block; width: 100%; text-align: left; padding: 8px 10px;
      border: none; background: transparent; font: inherit; color: #2a2a2e;
      border-radius: 5px; cursor: pointer;
    }
    .filter-option:hover { background: #f3f4f6; }
    .filter-option.active { color: #3b5bdb; background: #eef2ff; font-weight: 600; }
    .filter-divider { width: 1px; height: 20px; background: #e6e6e8; flex-shrink: 0; }
    .filter-icon-btn {
      position: relative; display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border: none; background: transparent;
      color: #5a5a5e; border-radius: 4px; cursor: pointer; padding: 0;
    }
    .filter-icon-btn:hover { background: #f3f4f6; color: #2a2a2e; }
    .filter-icon-btn svg { width: 16px; height: 16px; }
    .filter-dot {
      position: absolute; top: 4px; right: 4px; width: 7px; height: 7px;
      background: var(--blue-icon); border-radius: 50%; border: 1.5px solid #fff;
      display: none;
    }
    .filter-icon-btn.has-filter .filter-dot { display: block; }
    .settings-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border: none; background: transparent;
      color: #5a5a5e; border-radius: 4px; cursor: pointer; padding: 0;
    }
    .settings-btn:hover { background: #f3f4f6; color: #2a2a2e; }
    .settings-btn svg { width: 16px; height: 16px; }
    .type-filter-popover {
      display: none; position: absolute; top: calc(100% + 6px); left: 0;
      width: 280px; background: #fff; border: 1px solid #e6e6e8;
      border-radius: 8px; box-shadow: 0 6px 18px rgba(16,16,20,.12); z-index: 55;
      padding: 12px;
    }
    .type-filter-popover.open { display: flex; flex-direction: column; gap: 10px; }
    .type-filter-popover h4 { font-size: 13px; font-weight: 600; color: #2a2a2e; }
    .type-search {
      width: 100%; height: 30px; padding: 0 10px; border: 1px solid #e0e0e4;
      border-radius: 6px; font: inherit; font-size: 12px;
    }
    .type-search:focus { outline: none; border-color: var(--blue-selected); }
    .type-check-list {
      max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;
    }
    .type-check-item {
      display: flex; align-items: center; gap: 8px; padding: 4px 2px;
      font-size: 12px; cursor: pointer;
    }
    .type-check-item input { accent-color: var(--blue-icon); }
    .type-filter-footer { display: flex; justify-content: flex-end; gap: 8px; padding-top: 4px; }
    .btn {
      height: 28px; padding: 0 12px; border-radius: 6px; font: inherit;
      font-size: 12px; cursor: pointer; border: 1px solid #e0e0e4; background: #fff;
    }
    .btn:hover { background: #f3f4f6; }
    .btn-primary { background: var(--blue-icon); color: #fff; border-color: var(--blue-icon); }
    .btn-primary:hover { background: #3d66d8; }
    .edges { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 1; }
    .edges path.line { fill: none; stroke-width: 1.6; stroke-linecap: round; }
    .edges path.line.parent { stroke: var(--edge-parent); }
    .edges path.line.assoc { stroke: var(--edge-assoc); stroke-dasharray: 5 4; stroke-width: 1.5; }
    .edges path.arrow.parent { fill: var(--edge-parent); stroke: none; }
    .edges path.arrow.assoc { fill: var(--edge-assoc); stroke: none; }
    .edges.has-selection path.line:not(.highlight),
    .edges.has-selection path.arrow:not(.highlight) { opacity: 0.28; }
    .edges path.line.highlight {
      stroke: #5b7cf0; stroke-width: 2.2; opacity: 1;
    }
    .edges path.line.highlight.assoc {
      stroke: #7b92f0; stroke-dasharray: 5 4; stroke-width: 2;
    }
    .edges path.arrow.highlight { fill: #5b7cf0; opacity: 1; }
    .edges path.arrow.highlight.assoc { fill: #7b92f0; }
    .node.selected {
      border-color: var(--blue-selected); background: var(--blue-selected-bg);
      box-shadow: 0 0 0 .5px rgba(72,111,251,.25);
    }
    .node.selected .node-chip { background: #dfe3ec; }
    .node:hover {
      border-color: var(--blue-selected);
      box-shadow: 0 0 0 1px rgba(72, 111, 251, 0.4), 0 2px 8px rgba(72, 111, 251, 0.12);
    }
    .node.dragging:hover {
      box-shadow: 0 6px 18px rgba(16,16,20,.14);
    }
    .node {
      position: absolute; background: #fff; border: 1px solid var(--border-card);
      border-radius: 4px; padding: 8px 9px 9px;
      box-shadow: 0 1px 2px rgba(16,16,20,.05);
      display: flex; flex-direction: column; align-items: flex-start; gap: 5px;
      z-index: 2; cursor: grab; user-select: none; min-width: 168px;
      touch-action: none; text-rendering: geometricPrecision;
    }
    .node.hidden { display: none; }
    .node:active, .node.dragging {
      cursor: grabbing; z-index: 20; box-shadow: 0 6px 18px rgba(16,16,20,.14);
    }
    .node.center {
      border-color: var(--blue-selected); background: var(--blue-selected-bg);
      box-shadow: 0 0 0 .5px rgba(72,111,251,.25);
    }
    .node.center .node-chip { background: #dfe3ec; }
    .node.noperm { min-width: 120px; padding: 10px 12px; }
    .node.noperm .noperm-text { font-size: 12px; color: #6b6b6d; line-height: 1.3; }
    .node-chip {
      display: inline-flex; align-items: center; gap: 5px; align-self: stretch;
      background: var(--chip); border-radius: 3px; padding: 3px 8px 3px 5px;
      min-height: 22px; max-width: 100%; cursor: pointer;
    }
    .node-chip .icon { flex-shrink: 0; width: 13px; height: 13px; color: var(--blue-icon); display: block; }
    .node-id { font-size: 12px; font-weight: 600; color: var(--blue-title); line-height: 1.15; white-space: nowrap; }
    .node-fields { font-size: 11px; color: var(--text-sub); line-height: 1.35; padding-left: 1px; }
    .node-fields .field-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    .expand-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--blue-icon); color: #fff; border: none;
      display: none; align-items: center; justify-content: center;
      cursor: pointer; z-index: 5; font-size: 14px; font-weight: 700;
      line-height: 1; box-shadow: 0 2px 6px rgba(75,120,240,.35); padding: 0;
    }
    .expand-btn:hover { background: #3d66d8; }
    /* 节点 hover 或按钮自身 hover 时显示（按钮略伸出节点外） */
    .node:hover .expand-btn.show,
    .expand-btn.show:hover,
    .expand-btn.show:focus-visible { display: flex; }
    .expand-btn.fwd { right: -11px; }
    .expand-btn.back { left: -11px; }
    .zoom-bar {
      position: absolute; left: 26px; bottom: 26px;
      display: flex; align-items: center; height: 40px;
      background: #fff; border: 1px solid #e4e4e6; border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08); z-index: 30;
    }
    .zoom-group { display: flex; align-items: center; height: 100%; position: relative; }
    .zoom-btn {
      width: 34px; height: 100%; display: flex; align-items: center; justify-content: center;
      border: none; background: transparent; color: #2c2c30; cursor: pointer; padding: 0;
    }
    .zoom-btn:hover { background: #f3f4f6; }
    .zoom-btn .fs-exit { display: none; }
    .zoom-btn.is-fullscreen .fs-enter { display: none; }
    .zoom-btn.is-fullscreen .fs-exit { display: block; }
    .zoom-pct {
      min-width: 52px; height: 100%; display: inline-flex; align-items: center;
      justify-content: center; gap: 2px; border: none; background: transparent;
      font-size: 13px; font-weight: 500; font-family: inherit; color: #1b1b1d;
      font-variant-numeric: tabular-nums; user-select: none; cursor: pointer;
      padding: 0 4px; border-radius: 4px;
    }
    .zoom-pct:hover { background: #f3f4f6; }
    .zoom-pct svg { width: 10px; height: 10px; color: #6b6b6f; }
    .zoom-menu {
      display: none; position: absolute; left: 50%; bottom: calc(100% + 8px);
      transform: translateX(-50%); min-width: 88px; padding: 4px;
      background: #fff; border: 1px solid #e6e6e8; border-radius: 8px;
      box-shadow: 0 6px 18px rgba(16,16,20,.12); z-index: 60;
    }
    .zoom-menu.open { display: block; }
    .zoom-menu .filter-option { text-align: center; font-variant-numeric: tabular-nums; }
    .zoom-divider { width: 1px; height: 22px; background: #e6e6e8; margin: 0 2px; }
    .edge-legend {
      position: absolute; right: 26px; bottom: 26px; z-index: 30;
      display: flex; align-items: center; height: 40px; gap: 22px; padding: 0 16px;
      background: #fff; border: 1px solid #e4e4e6; border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08); user-select: none;
    }
    .legend-item { display: flex; flex-direction: row; align-items: center; gap: 6px; }
    .legend-line { width: 18px; height: 2px; display: block; flex-shrink: 0; border-radius: 1px; }
    .legend-line.parent { background: #C4D1C2; }
    .legend-line.assoc {
      background: repeating-linear-gradient(to right, #CED2D9 0 4px, transparent 4px 7px);
    }
    .legend-end { display: inline-flex; align-items: center; flex-shrink: 0; margin-left: 6px; }
    .legend-end .legend-line { width: 14px; border-radius: 1px 0 0 1px; }
    .legend-arrow {
      width: 0; height: 0; border-top: 4px solid transparent;
      border-bottom: 4px solid transparent; border-left: 6px solid #C4D1C2;
      flex-shrink: 0; margin-left: -1px;
    }
    .legend-arrow.assoc { border-left-color: #CED2D9; }
    .legend-item > span:not([class]) { font-size: 12px; color: #5a5a5e; line-height: 1; white-space: nowrap; }
    .node-popover {
      display: none; position: absolute; z-index: 50; width: 320px;
      max-height: min(420px, calc(100% - 48px)); background: #fff;
      border: 1px solid #e6e6e8; border-radius: 8px;
      box-shadow: 0 8px 28px rgba(16,16,20,.14); overflow: hidden;
      font-size: 13px; color: #2a2a2e; pointer-events: auto;
    }
    .node-popover.open { display: flex; flex-direction: column; }
    .node-popover-body {
      overflow-y: auto; padding: 14px 16px 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .pop-row { display: grid; grid-template-columns: 108px 1fr; gap: 10px; align-items: start; }
    .pop-label { color: #6b6b6f; line-height: 22px; white-space: nowrap; }
    .pop-value { color: #1b1b1d; line-height: 22px; word-break: break-all; }
    .pop-value.muted { color: #9a9aa0; }
    .pop-name {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--blue-title); font-weight: 600; cursor: pointer;
    }
    .pop-name .icon { width: 14px; height: 14px; color: var(--blue-icon); flex-shrink: 0; }
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
      z-index: 100; align-items: center; justify-content: center;
      padding: 24px;
    }
    .modal-overlay.open { display: flex; }
    .settings-modal {
      width: min(640px, calc(100vw - 48px)); max-height: calc(100vh - 48px);
      background: #fff; border-radius: 8px;
      box-shadow: 0 6px 16px 0 rgba(0,0,0,.08), 0 3px 6px -4px rgba(0,0,0,.12), 0 9px 28px 8px rgba(0,0,0,.05);
      display: flex; flex-direction: column; overflow: hidden;
      color: rgba(0,0,0,.88);
    }
    .settings-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px; border-bottom: 1px solid #f0f0f0;
      font-size: 16px; font-weight: 600; line-height: 1.5; flex-shrink: 0;
    }
    .settings-close {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; margin: -4px -8px -4px 0; padding: 0;
      border: none; background: transparent; border-radius: 4px;
      color: rgba(0,0,0,.45); cursor: pointer; flex-shrink: 0;
    }
    .settings-close:hover { color: rgba(0,0,0,.88); background: rgba(0,0,0,.04); }
    .settings-close svg { width: 14px; height: 14px; }
    .settings-body {
      flex: 1; overflow-y: auto; padding: 20px 24px 8px;
      display: flex; flex-direction: column; gap: 0;
    }
    .settings-section { padding-bottom: 20px; }
    .settings-section + .settings-section {
      padding-top: 20px; border-top: 1px solid #f0f0f0;
    }
    .settings-section h5 {
      font-size: 14px; font-weight: 600; margin-bottom: 12px;
      color: rgba(0,0,0,.88); line-height: 22px;
    }
    .settings-select-all {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px; font-size: 14px; line-height: 22px; cursor: pointer;
      user-select: none; width: fit-content;
    }
    .settings-select-all input,
    .settings-check-grid label input,
    .custom-field-checks label input {
      width: 16px; height: 16px; margin: 0; flex-shrink: 0;
      accent-color: #1677ff; cursor: pointer;
    }
    .settings-check-grid {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 16px; row-gap: 12px;
    }
    .settings-check-grid label,
    .custom-field-checks label {
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; line-height: 22px; color: rgba(0,0,0,.88);
      cursor: pointer; user-select: none; min-width: 0;
    }
    .custom-fields-wrap {
      display: flex; align-items: stretch; min-height: 220px;
      border: 1px solid #f0f0f0; border-radius: 6px; overflow: hidden;
    }
    .custom-type-list {
      width: 168px; flex-shrink: 0; overflow-y: auto; max-height: 260px;
      border-right: 1px solid #f0f0f0; background: #fff;
    }
    .custom-type-item {
      padding: 9px 16px; font-size: 14px; line-height: 22px;
      cursor: pointer; color: rgba(0,0,0,.88); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .custom-type-item:hover { background: rgba(0,0,0,.04); }
    .custom-type-item.active {
      background: #e6f4ff; color: #1677ff; font-weight: 500;
    }
    .custom-field-checks {
      flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 24px; row-gap: 12px; align-content: flex-start;
      padding: 12px 20px; overflow-y: auto; max-height: 260px;
    }
    .custom-field-empty {
      grid-column: 1 / -1; font-size: 14px; color: rgba(0,0,0,.45); padding: 4px 0;
    }
    .settings-footer {
      padding: 12px 24px 16px; border-top: 1px solid #f0f0f0;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      flex-shrink: 0;
    }
    .settings-footer .btn {
      height: 32px; padding: 0 16px; border-radius: 6px;
      font-size: 14px; line-height: 1; border: 1px solid #d9d9d9;
      background: #fff; color: rgba(0,0,0,.88);
    }
    .settings-footer .btn:hover {
      border-color: #4096ff; color: #4096ff; background: #fff;
    }
    .settings-footer .btn-primary {
      background: #1677ff; color: #fff; border-color: #1677ff;
    }
    .settings-footer .btn-primary:hover {
      background: #4096ff; border-color: #4096ff; color: #fff;
    }
    .settings-footer-right { display: flex; align-items: center; gap: 8px; }
    @media (max-width: 560px) {
      .settings-check-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .custom-fields-wrap { flex-direction: column; }
      .custom-type-list {
        width: 100%; max-height: 120px; border-right: none;
        border-bottom: 1px solid #f0f0f0;
      }
      .custom-field-checks { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="map" id="map">
    <div class="stage" id="stage">
      <svg class="edges" id="edges" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <div class="filter-bar" id="filter-bar">
      <div class="filter-dropdown" id="relation-dropdown">
        <button class="filter-trigger" type="button" id="relation-trigger">
          <span id="relation-label">全部关系</span>
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
        </button>
        <div class="filter-menu" id="relation-menu">
          <button class="filter-option active" type="button" data-value="all">全部关系</button>
          <button class="filter-option" type="button" data-value="parent">父子关系</button>
          <button class="filter-option" type="button" data-value="assoc">关联关系</button>
        </div>
      </div>
      <div class="filter-divider"></div>
      <div class="filter-dropdown" id="type-filter-dropdown">
        <button class="filter-icon-btn" type="button" id="type-filter-btn" title="筛选对象" aria-label="筛选对象">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3.5h12"/><path d="M4 8h8"/><path d="M6.5 12.5h3"/>
            <circle cx="5.5" cy="3.5" r="1.35" fill="currentColor" stroke="none"/>
            <circle cx="10" cy="8" r="1.35" fill="currentColor" stroke="none"/>
            <circle cx="8" cy="12.5" r="1.35" fill="currentColor" stroke="none"/>
          </svg>
          <span class="filter-dot"></span>
        </button>
        <div class="type-filter-popover" id="type-filter-popover">
          <h4>筛选对象</h4>
          <input class="type-search" type="search" id="type-search" placeholder="搜索对象类型…" />
          <div class="type-check-list" id="type-check-list"></div>
          <div class="type-filter-footer">
            <button class="btn btn-primary" type="button" id="type-filter-confirm">确定</button>
          </div>
        </div>
      </div>
      <button class="settings-btn" type="button" id="settings-btn" title="节点字段显示设置" aria-label="节点字段显示设置">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.2 3.2l1.4 1.4M11.4 11.4l1.4 1.4M3.2 12.8l1.4-1.4M11.4 4.6l1.4-1.4"/>
        </svg>
      </button>
    </div>

    <div class="zoom-bar">
      <div class="zoom-group">
        <button class="zoom-btn" type="button" id="zoom-out" aria-label="缩小">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 7h8"/></svg>
        </button>
        <div class="zoom-group" style="position:relative">
          <button class="zoom-pct" type="button" id="zoom-pct">
            <span id="zoom-pct-text">100%</span>

    return { basic, custom };
  }

  function loadFieldSettings() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return defaultFieldSettings();
      const parsed = JSON.parse(raw);
      const base = defaultFieldSettings();
      Object.assign(base.basic, parsed.basic || {});
      Object.keys(base.custom).forEach((t) => {
        if (parsed.custom && parsed.custom[t]) Object.assign(base.custom[t], parsed.custom[t]);
      });
      return base;
    } catch (_) { return defaultFieldSettings(); }
  }

    localStorage.setItem(LS_KEY, JSON.stringify(s));
    state.fieldSettings = s;

  function computeLayers() {
    // 统一逻辑：沿出边 +1（后关联），沿入边 -1（前关联）；不区分父子/关联类型
    const layers = { [CENTER_ID]: 0 };
    const q = [CENTER_ID];
    while (q.length) {
      const cur = q.shift();
      const curLayer = layers[cur];
      edges.forEach((e) => {
        if (e.from === cur && layers[e.to] === undefined) {
          layers[e.to] = curLayer + 1;
          q.push(e.to);
        }
        if (e.to === cur && layers[e.from] === undefined) {
          layers[e.from] = curLayer - 1;
          q.push(e.from);
        }
      });
    }
    nodes.forEach((n) => { if (layers[n.id] === undefined) layers[n.id] = 99; });
    state.layers = layers;
    return layers;
  }

  /** 当前关系筛选下，边是否参与显示与连通判断 */
  function edgeMatchesRelation(e) {
    return state.relation === "all" || e.type === state.relation;
  }

  function isTypeVisible(n) {
    if (!n) return false;
    // 基准中心始终参与连通与显示
    if (n.id === CENTER_ID) return true;
    return state.typeFilter.has(n.object);
  }

  /** 在「类型+关系筛选后的子图」中，与中心有路径相连的节点（连通不区分方向） */
  function computeConnectedToCenter() {
    const connected = new Set([CENTER_ID]);
    const q = [CENTER_ID];
    while (q.length) {
      const cur = q.shift();
      edges.forEach((e) => {
        if (!edgeMatchesRelation(e)) return;
        let next = null;
        if (e.from === cur) next = e.to;
        else if (e.to === cur) next = e.from;
        if (!next || connected.has(next)) return;
        const n = nodeById[next];
        if (!isTypeVisible(n)) return;
        connected.add(next);
        q.push(next);
      });
    }
    return connected;
  }

  function computeVisibility() {
    const layers = computeLayers();
    const connected = computeConnectedToCenter();
    const visible = new Set();
    const frontierBack = new Set();
    const frontierFwd = new Set();

    nodes.forEach((n) => {
      if (!isTypeVisible(n)) return;
      // 与中心断连的（含因中间类型/关系被筛掉而断链）一律不显示
      if (!connected.has(n.id)) return;
      const L = layers[n.id];
      if (L >= -state.depthBack && L <= state.depthFwd) visible.add(n.id);
    });

    visible.forEach((id) => {
      const L = layers[id];
      edges.forEach((e) => {
        if (!edgeMatchesRelation(e)) return;
        let nid = null;
        if (e.from === id) nid = e.to;
        else if (e.to === id) nid = e.from;
        else return;
        const n = nodeById[nid];
        const nL = layers[nid];
        if (!isTypeVisible(n) || !connected.has(nid)) return;
        // 边界上仍有更深/更浅邻居时，显示穿透按钮（不依赖边方向）
        if (L === state.depthFwd && nL > state.depthFwd) frontierFwd.add(id);
        if (L === -state.depthBack && nL < -state.depthBack) frontierBack.add(id);
      });
    });

    state.visibleIds = visible;
    state.frontierBack = frontierBack;
    state.frontierFwd = frontierFwd;
  }

  function isNodeShown(n) {
    return state.visibleIds.has(n.id);
  }

  function entityUrl(id) { return `https://example.com/entity/${id}`; }

  function getIcon(type) { return ICONS[type] || ICONS.Other; }

  function fieldLabel(key) {
    const f = BASIC_FIELDS.find((x) => x.key === key);
    return f ? f.label : key;
  }

  function getNodeSubtitleLines(n) {
    const lines = [];
    const fs = state.fieldSettings;
    BASIC_FIELDS.forEach((f) => {
      if (!fs.basic[f.key]) return;
      const val = n.fields[f.key];
      if (val) lines.push(`${f.label}：${val}`);
    });
    const customs = fs.custom[n.object] || {};
    Object.keys(customs).forEach((k) => {
      if (!customs[k]) return;
      const val = n.custom[k.replace(/ /g, "_")] || n.custom[k];
      if (val) lines.push(`${k}：${val}`);
    });
    return lines;
  }

  function measureNodeHeight(n) {
    const el = nodeEls[n.id];
    if (!el || el.classList.contains("hidden")) return 56;
    return Math.max(el.offsetHeight || 56, 40);
  }

  function autoLayout(force = false) {
    if (force) state.nodePositions = {};
    const byCol = {};
    nodes.forEach((n) => {
      if (!state.visibleIds.has(n.id)) return;
      const col = state.layers[n.id];
      if (!byCol[col]) byCol[col] = [];
      byCol[col].push(n);
    });
    const cols = Object.keys(byCol).map(Number).sort((a, b) => a - b);

    cols.forEach((col, idx) => {
      const list = byCol[col];
      if (idx > 0) {
        const prevCol = cols[idx - 1];
        const prevIndex = Object.fromEntries(byCol[prevCol].map((n, i) => [n.id, i]));
        list.sort((a, b) => {
          const score = (n) => {
            const linked = edges
              .filter((e) => (e.from === n.id || e.to === n.id))
              .map((e) => (e.from === n.id ? e.to : e.from))
              .filter((id) => prevIndex[id] !== undefined);
            if (!linked.length) return 0;
            return linked.reduce((s, id) => s + prevIndex[id], 0) / linked.length;
          };
          return score(a) - score(b) || a.label.localeCompare(b.label);
        });
      } else {
        list.sort((a, b) => a.label.localeCompare(b.label));
      }

      const colX = START_X + (col + state.depthBack) * COL_GAP;
      list.forEach((n) => {
        const el = nodeEls[n.id];
        if (el) el.style.left = colX + "px";
      });

      let yCursor = START_Y;
      const heights = list.map((n) => measureNodeHeight(n));

      list.forEach((n, i) => {
        const saved = state.nodePositions[n.id];
        if (!force && saved) {
          n.x = saved.x;
          n.y = saved.y;
        } else {
          n.x = Math.round(colX);
          n.y = Math.round(yCursor);
          state.nodePositions[n.id] = { x: n.x, y: n.y };
          yCursor += heights[i] + NODE_GAP;
        }
      });
    });

    // 各列相对中心列垂直居中
    if (force && byCol[0] && byCol[0].length) {
      const centerNodes = byCol[0];
      const cMin = Math.min(...centerNodes.map((n) => n.y));
      const cMax = Math.max(...centerNodes.map((n) => n.y + measureNodeHeight(n)));
      const cMid = (cMin + cMax) / 2;
      cols.forEach((col) => {
        if (col === 0) return;
        const list = byCol[col];
        if (!list.length) return;
        const minY = Math.min(...list.map((n) => n.y));
        const maxY = Math.max(...list.map((n) => n.y + measureNodeHeight(n)));
        const dy = cMid - (minY + maxY) / 2;
        list.forEach((n) => {
          n.y = Math.round(n.y + dy);
          state.nodePositions[n.id] = { x: n.x, y: n.y };
        });
      });
    }
  }

  /** 清空手动位置，按节点真实高度重排并适应画布 */
  function beautifyLayout() {
    nodes.forEach((n) => updateNodeEl(n));
    requestAnimationFrame(() => {
      autoLayout(true);
      nodes.forEach((n) => {
        const el = nodeEls[n.id];
        if (!el) return;
        el.style.left = n.x + "px";
        el.style.top = n.y + "px";
      });
      drawEdges();
      requestAnimationFrame(() => fitView());
    });
  }

  function snapPan(v) {
    const dpr = window.devicePixelRatio || 1;
    return Math.round(v * dpr) / dpr;
  }

  function applyViewTransform() {
    view.panX = snapPan(view.panX);
    view.panY = snapPan(view.panY);
    if (Math.abs(view.scale - 1) < 0.0005) {
      view.scale = 1;
      stage.style.transform = `translate(${view.panX}px, ${view.panY}px)`;
    } else {
      stage.style.transform = `translate(${view.panX}px, ${view.panY}px) scale(${view.scale})`;
    }
    document.getElementById("zoom-pct-text").textContent = Math.round(view.scale * 100) + "%";
    document.querySelectorAll("#zoom-menu .filter-option").forEach((opt) => {
      opt.classList.toggle("active", Math.abs(Number(opt.dataset.zoom) - view.scale) < 0.001);
    });
    if (state.activePopoverId && nodeEls[state.activePopoverId]) positionPopover(nodeEls[state.activePopoverId]);
  }

  function setZoom(next, ax, ay) {
    const prev = view.scale;
    const scale = Math.min(view.max, Math.max(view.min, next));
    const rect = map.getBoundingClientRect();
    const anchorX = (ax ?? rect.left + rect.width / 2) - rect.left;
    const anchorY = (ay ?? rect.top + rect.height / 2) - rect.top;
    view.scale = scale;
    view.panX = anchorX - ((anchorX - view.panX) / prev) * scale;
    view.panY = anchorY - ((anchorY - view.panY) / prev) * scale;
    applyViewTransform();
  }

  function getContentBounds() {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity, any = false;
    nodes.forEach((n) => {
      if (!isNodeShown(n)) return;
      const el = nodeEls[n.id];
      if (!el) return;
      any = true;
      const w = el.offsetWidth || 168, h = el.offsetHeight || 56;
      minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + w); maxY = Math.max(maxY, n.y + h);
    });
    return any ? { minX, minY, maxX, maxY, width: maxX - minX, height: maxY - minY } : null;
  }

  function fitView() {
    const b = getContentBounds();
    if (!b) return;
    const pad = 80;
    view.scale = Math.min(view.max, Math.max(view.min,
      Math.min((map.clientWidth - pad * 2) / b.width, (map.clientHeight - pad * 2) / b.height)));
    view.panX = (map.clientWidth - b.width * view.scale) / 2 - b.minX * view.scale;
    view.panY = (map.clientHeight - b.height * view.scale) / 2 - b.minY * view.scale;
    applyViewTransform();
  }

  function centerOnNode(id) {
    const n = nodeById[id];
    const el = nodeEls[id];
    if (!n || !el) return;
    view.scale = 1;
    view.panX = map.clientWidth * 0.4 - (n.x + el.offsetWidth / 2);
    view.panY = map.clientHeight * 0.42 - (n.y + el.offsetHeight / 2);
    applyViewTransform();
  }

  function port(el, side) {
    const y = el.offsetTop + el.offsetHeight / 2;
    const x = side === "right" ? el.offsetLeft + el.offsetWidth : el.offsetLeft;
    return { x, y };
  }

  function curve(a, b) {
    const dx = Math.max(48, (b.x - a.x) * 0.48);
    return `M ${a.x} ${a.y} C ${a.x + dx} ${a.y}, ${b.x - dx} ${b.y}, ${b.x} ${b.y}`;
  }

  function horizontalArrow(tipX, tipY, size) {
    const baseX = tipX - size, h = size * 0.55;
    return `M ${tipX} ${tipY} L ${baseX} ${tipY - h} L ${baseX} ${tipY + h} Z`;
  }

  function isEdgeRelatedToSelection(edge, selectedId) {
    if (!selectedId) return false;
    return edge.from === selectedId || edge.to === selectedId;
  }

  function setSelectedNode(nodeId) {
    state.selectedId = nodeId || null;
    nodes.forEach((n) => {
      const el = nodeEls[n.id];
      if (el) el.classList.toggle("selected", !n.noPermission && n.id === state.selectedId);
    });
    drawEdges();
  }

  function clearSelectedNode() {
    setSelectedNode(null);
  }

  function drawEdges() {
    const b = getContentBounds() || { minX: 0, minY: 0, maxX: 1400, maxY: 900 };
    const pad = 200;
    const w = Math.ceil(Math.max(b.maxX + pad, 1200));
    const h = Math.ceil(Math.max(b.maxY + pad, 800));
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    svg.setAttribute("width", String(w));
    svg.setAttribute("height", String(h));
    svg.style.width = w + "px";
    svg.style.height = h + "px";
    const selectedId = state.selectedId;
    svg.classList.toggle("has-selection", Boolean(selectedId));
    const parts = [];
    const arrowByTarget = new Map();
    edges.forEach((e) => {
      if (!edgeMatchesRelation(e)) return;
      const fromN = nodeById[e.from], toN = nodeById[e.to];
      if (!isNodeShown(fromN) || !isNodeShown(toN)) return;
      const fromEl = nodeEls[e.from], toEl = nodeEls[e.to];
      if (!fromEl || !toEl) return;
      const from = port(fromEl, "right");
      const tip = port(toEl, "left");
      const lineEnd = { x: tip.x - ARROW_SIZE, y: tip.y };
      const cls = e.type === "assoc" ? "assoc" : "parent";
      const related = isEdgeRelatedToSelection(e, selectedId);
      const hi = related ? " highlight" : "";
      parts.push(`<path class="line ${cls}${hi}" d="${curve(from, lineEnd)}" />`);
      const rank = (isHi) => (isHi ? 2 : 0) + (e.type === "parent" ? 1 : 0);
      const prev = arrowByTarget.get(e.to);
      if (!prev || rank(related) > prev.rank) {
        arrowByTarget.set(e.to, { tip, type: e.type, highlight: related, rank: rank(related) });
      }
    });
    arrowByTarget.forEach(({ tip, type, highlight }) => {
      const cls = type === "assoc" ? "assoc" : "parent";
      const hi = highlight ? " highlight" : "";
      parts.push(`<path class="arrow ${cls}${hi}" d="${horizontalArrow(tip.x, tip.y, ARROW_SIZE)}" />`);
    });
    svg.innerHTML = parts.join("");
  }

  function buildNodeFieldsHtml(n) {
    const lines = getNodeSubtitleLines(n);
    if (!lines.length) return "";
    return `<div class="node-fields">${lines.map((l) => `<div class="field-line">${l}</div>`).join("")}</div>`;
  }

  /** 穿透展开一层：重排列坐标，并保持中心节点屏幕位置稳定 */
  function expandLayer(dir) {
    const center = nodeById[CENTER_ID];
    const prevCenterX = center ? center.x : 0;
    const prevScreenX = prevCenterX * view.scale + view.panX;

    if (dir === "back") state.depthBack += 1;
    else state.depthFwd += 1;

    // 深度变化后列间距基准变化，必须清空手动坐标并强制重排，否则新节点会叠在旧列上
    state.nodePositions = {};
    computeVisibility();

    nodes.forEach((n) => {
      let el = nodeEls[n.id];
      if (!el) {
        el = document.createElement("div");
        el.id = "node-" + n.id;
        el.dataset.id = n.id;
        stage.appendChild(el);
        nodeEls[n.id] = el;
      }
      // 先更新显隐，便于测量高度
      updateNodeEl(n);
    });

    requestAnimationFrame(() => {
      autoLayout(true);
      nodes.forEach((n) => {
        const el = nodeEls[n.id];
        if (!el) return;
        el.style.left = n.x + "px";
        el.style.top = n.y + "px";
        updateExpandButtons(n, el);
      });
      drawEdges();

      if (center) {
        view.panX = prevScreenX - center.x * view.scale;
        applyViewTransform();
      }

      // 若新展开节点仍在视口外，轻微平移把它带进视野
      bringExpandedNodesIntoView(dir);
    });
  }

  function bringExpandedNodesIntoView(dir) {
    const pad = 48;
    const mapW = map.clientWidth;
    let target = null;
    nodes.forEach((n) => {
      if (!isNodeShown(n)) return;
      const L = state.layers[n.id];
      if (dir === "back" && L === -state.depthBack) {
        if (!target || n.x < target.x) target = n;
      }
      if (dir === "fwd" && L === state.depthFwd) {
        if (!target || n.x > target.x) target = n;
      }
    });
    if (!target) return;
    const el = nodeEls[target.id];
    const w = (el && el.offsetWidth) || 168;
    const screenLeft = target.x * view.scale + view.panX;
    const screenRight = (target.x + w) * view.scale + view.panX;
    if (dir === "back" && screenLeft < pad) {
      view.panX += pad - screenLeft;
      applyViewTransform();
    } else if (dir === "fwd" && screenRight > mapW - pad) {
      view.panX -= screenRight - (mapW - pad);
      applyViewTransform();
    }
  }

  function updateNodeEl(n) {
    const el = nodeEls[n.id];
    if (!el) return;
    const shown = isNodeShown(n);
    el.classList.toggle("hidden", !shown);
    el.classList.toggle("center", n.id === CENTER_ID);
    if (n.noPermission) {
      el.className = "node noperm" + (shown ? "" : " hidden");
      el.innerHTML = `<div class="noperm-text">无权限查看</div>`;
      if (!el.dataset.dragBound) enableDrag(el, n);
      return;
    }
    el.className = "node"
      + (n.id === CENTER_ID ? " center" : "")
      + (state.selectedId === n.id ? " selected" : "")
      + (shown ? "" : " hidden");
    el.innerHTML = `
      <div class="node-chip">${getIcon(n.iconType)}<span class="node-id">${n.label}</span></div>
      ${buildNodeFieldsHtml(n)}
      <button class="expand-btn back" type="button" data-dir="back" aria-label="展开上游">‹</button>
      <button class="expand-btn fwd" type="button" data-dir="fwd" aria-label="展开下游">›</button>`;
    if (!el.dataset.chipBound) {
      el.dataset.chipBound = "1";
      setupChipInteractions(el, n);
    }
    if (!el.dataset.dragBound) enableDrag(el, n);
    updateExpandButtons(n, el);
  }

  function updateExpandButtons(n, el) {
    const backBtn = el.querySelector(".expand-btn.back");
    const fwdBtn = el.querySelector(".expand-btn.fwd");
    if (!backBtn || !fwdBtn) return;
    backBtn.classList.toggle("show", state.frontierBack.has(n.id));
    fwdBtn.classList.toggle("show", state.frontierFwd.has(n.id));
  }

  function renderAllNodes() {
    nodes.forEach((n) => {
      let el = nodeEls[n.id];
      if (!el) {
        el = document.createElement("div");
        el.id = "node-" + n.id;
        el.dataset.id = n.id;
        stage.appendChild(el);
        nodeEls[n.id] = el;
      }
      el.style.left = n.x + "px";
      el.style.top = n.y + "px";
      updateNodeEl(n);
    });
  }

  function refreshGraph() {
    computeVisibility();
    autoLayout();
    nodes.forEach((n) => {
      let el = nodeEls[n.id];
      if (!el) {
        el = document.createElement("div");
        el.id = "node-" + n.id;
        el.dataset.id = n.id;
        stage.appendChild(el);
        nodeEls[n.id] = el;
      }
      el.style.left = n.x + "px";
      el.style.top = n.y + "px";
      updateNodeEl(n);
    });
    drawEdges();
  }

  function setupChipInteractions(nodeEl, n) {
    // 委托到节点容器：updateNodeEl 会重写 innerHTML，不能绑在 chip 自身上
    let overChip = false;
    nodeEl.addEventListener("pointermove", (ev) => {
      const chip = nodeEl.querySelector(".node-chip");
      const now = !!(chip && chip.contains(ev.target));
      if (now === overChip) return;
      overChip = now;
      if (now) {
        clearTimeout(state.popoverTimer);
        clearTimeout(state.popoverShowTimer);
        state.popoverShowTimer = setTimeout(() => showPopover(n, nodeEl), POPOVER_SHOW_DELAY);
      } else {
        clearTimeout(state.popoverShowTimer);
        state.popoverTimer = setTimeout(hidePopover, POPOVER_HIDE_DELAY);
      }
    });
    nodeEl.addEventListener("pointerleave", () => {
      if (!overChip) return;
      overChip = false;
      clearTimeout(state.popoverShowTimer);
      state.popoverTimer = setTimeout(hidePopover, POPOVER_HIDE_DELAY);
    });
    nodeEl.addEventListener("click", (ev) => {
      if (!ev.target.closest(".node-chip")) return;
      ev.stopPropagation();
      clearTimeout(state.popoverShowTimer);
      setSelectedNode(n.id);
      window.open(entityUrl(n.id), "_blank", "noopener");
    });
  }

  function buildPopoverDetail(n) {
    const rows = [];
    rows.push(`<div class="pop-row"><div class="pop-label">名称</div><div class="pop-value"><span class="pop-name">${getIcon(n.iconType)}<span>${n.label}</span></span></div></div>`);
    BASIC_FIELDS.forEach((f) => {
      const val = n.fields[f.key] || "—";
      rows.push(`<div class="pop-row"><div class="pop-label">${f.label}</div><div class="pop-value">${val}</div></div>`);
    });
    const customs = CUSTOM_FIELDS_BY_OBJECT[n.object] || [];
    customs.forEach((k) => {
      const val = n.custom[k.replace(/ /g, "_")] || n.custom[k] || "—";
      rows.push(`<div class="pop-row"><div class="pop-label">${k}</div><div class="pop-value">${val}</div></div>`);
    });
    return rows.join("");
  }

  function positionPopover(nodeEl) {
    const mapRect = map.getBoundingClientRect();
    const chip = nodeEl.querySelector(".node-chip") || nodeEl;
    const nodeRect = chip.getBoundingClientRect();
    const popW = popover.offsetWidth || 320;
    const popH = popover.offsetHeight || 360;
    const gap = 10, margin = 16;
    let left = nodeRect.left - mapRect.left;
    if (left + popW > mapRect.width - margin) left = mapRect.width - popW - margin;
    if (left < margin) left = margin;
    const belowTop = nodeRect.bottom - mapRect.top + gap;
    const aboveTop = nodeRect.top - mapRect.top - popH - gap;
    const spaceBelow = mapRect.height - (nodeRect.bottom - mapRect.top) - margin;
    let top = spaceBelow >= popH + gap ? belowTop : (aboveTop >= margin ? aboveTop : Math.min(belowTop, Math.max(margin, mapRect.height - popH - margin)));
    popover.style.left = Math.round(left) + "px";
    popover.style.top = Math.round(top) + "px";
  }

  function showPopover(n, nodeEl) {
    if (n.noPermission) return;
    state.activePopoverId = n.id;
    popoverBody.innerHTML = buildPopoverDetail(n);
    popover.classList.add("open");
    requestAnimationFrame(() => positionPopover(nodeEl));
  }

  function hidePopover() {
    clearTimeout(state.popoverShowTimer);
    state.activePopoverId = null;
    popover.classList.remove("open");
  }

  popover.addEventListener("mouseenter", () => {
    clearTimeout(state.popoverTimer);
    clearTimeout(state.popoverShowTimer);
  });
  popover.addEventListener("mouseleave", () => { state.popoverTimer = setTimeout(hidePopover, POPOVER_HIDE_DELAY); });

  function enableDrag(el, n) {
    if (el.dataset.dragBound) return;
    el.dataset.dragBound = "1";
    if (n.noPermission) {
      let dragging = false, sx, sy, ox, oy;
      el.addEventListener("pointerdown", (ev) => {
        if (ev.button !== 0) return;
        dragging = true;
        el.classList.add("dragging");
        el.setPointerCapture(ev.pointerId);
        sx = ev.clientX; sy = ev.clientY; ox = n.x; oy = n.y;
        ev.preventDefault();
        ev.stopPropagation();
      });
      el.addEventListener("pointermove", (ev) => {
        if (!dragging) return;
        n.x = ox + (ev.clientX - sx) / view.scale;
        n.y = oy + (ev.clientY - sy) / view.scale;
        el.style.left = n.x + "px"; el.style.top = n.y + "px";
        state.nodePositions[n.id] = { x: n.x, y: n.y };
        drawEdges();
      });
      el.addEventListener("pointerup", () => { dragging = false; el.classList.remove("dragging"); });
      return;
    }
    let dragging = false, moved = false, sx, sy, ox, oy;
    const onDown = (ev) => {
      if (ev.button !== 0 || ev.target.closest(".expand-btn")) return;
      // 点击节点（含标签）即选中并高亮上下连线
      if (!ev.target.closest(".node-chip")) setSelectedNode(n.id);
      if (ev.target.closest(".node-chip")) return; // chip 自己处理 click
      dragging = true; moved = false;
      el.classList.add("dragging");
      el.setPointerCapture(ev.pointerId);
      sx = ev.clientX; sy = ev.clientY; ox = n.x; oy = n.y;
      hidePopover();
      ev.preventDefault();
      ev.stopPropagation();
    };
    const onMove = (ev) => {
      if (!dragging) return;
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!moved && Math.hypot(dx, dy) > CLICK_MOVE_THRESHOLD) moved = true;
      if (!moved) return;
      n.x = ox + dx / view.scale; n.y = oy + dy / view.scale;
      el.style.left = n.x + "px"; el.style.top = n.y + "px";
      state.nodePositions[n.id] = { x: n.x, y: n.y };
      drawEdges();
    };
    const onUp = () => { dragging = false; el.classList.remove("dragging"); };
    el.addEventListener("pointerdown", onDown);
    el.addEventListener("pointermove", onMove);
    el.addEventListener("pointerup", onUp);
    el.addEventListener("pointercancel", onUp);
  }

  function setupFilters() {
    const relTrigger = document.getElementById("relation-trigger");
    const relMenu = document.getElementById("relation-menu");
    const relLabel = document.getElementById("relation-label");
    relTrigger.addEventListener("click", (ev) => {
      ev.stopPropagation();
      relMenu.classList.toggle("open");
      document.getElementById("type-filter-popover").classList.remove("open");
    });
    relMenu.querySelectorAll(".filter-option").forEach((opt) => {
      opt.addEventListener("click", () => {
        state.relation = opt.dataset.value;
        relLabel.textContent = RELATION_LABELS[state.relation];
        relMenu.querySelectorAll(".filter-option").forEach((o) => o.classList.toggle("active", o.dataset.value === state.relation));
        relMenu.classList.remove("open");
        // 与对象筛选相同：按当前关系子图相对中心的连通性刷新节点显隐
        refreshGraph();
      });
    });
  }

  function renderTypeFilterList(filter) {
    const list = document.getElementById("type-check-list");
    const q = (document.getElementById("type-search").value || "").trim().toLowerCase();
    list.innerHTML = ALL_OBJECTS.filter((t) => !q || t.toLowerCase().includes(q)).map((t) => `
      <label class="type-check-item">
        <input type="checkbox" data-type="${t}" ${filter.has(t) ? "checked" : ""} />
        <span>${t}</span>
      </label>`).join("");
    list.querySelectorAll("input[data-type]").forEach((inp) => {
      inp.addEventListener("change", () => {
        if (!state.typeFilterDraft) state.typeFilterDraft = new Set(state.typeFilter);
        if (inp.checked) state.typeFilterDraft.add(inp.dataset.type);
        else state.typeFilterDraft.delete(inp.dataset.type);
      });
    });
  }

  function updateTypeFilterDot() {
    document.getElementById("type-filter-btn").classList.toggle("has-filter", state.typeFilter.size < ALL_OBJECTS.length);
  }

  function setupTypeFilter() {
    const btn = document.getElementById("type-filter-btn");
    const pop = document.getElementById("type-filter-popover");
    const search = document.getElementById("type-search");
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      state.typeFilterDraft = new Set(state.typeFilter);
      renderTypeFilterList(state.typeFilterDraft);
      pop.classList.toggle("open");
      document.getElementById("relation-menu").classList.remove("open");
    });
    search.addEventListener("input", () => renderTypeFilterList(state.typeFilterDraft || state.typeFilter));
    document.getElementById("type-filter-confirm").addEventListener("click", () => {
      const checked = new Set();
      pop.querySelectorAll("input[data-type]:checked").forEach((inp) => checked.add(inp.dataset.type));
      if (checked.size) state.typeFilter = checked;
      pop.classList.remove("open");
      updateTypeFilterDot();
      refreshGraph();
    });
    updateTypeFilterDot();
  }

  function renderSettingsModal(draft) {
    const basicWrap = document.getElementById("basic-field-checks");
    const selectAll = document.getElementById("basic-select-all");
    basicWrap.innerHTML = BASIC_FIELDS.map((f) => `
      <label>
        <input type="checkbox" data-basic="${f.key}" ${draft.basic[f.key] ? "checked" : ""} />
        <span>${f.label}</span>
      </label>
    `).join("");
    selectAll.checked = BASIC_FIELDS.every((f) => draft.basic[f.key]);
    selectAll.onchange = (ev) => {
      BASIC_FIELDS.forEach((f) => { draft.basic[f.key] = ev.target.checked; });
      basicWrap.querySelectorAll("[data-basic]").forEach((inp) => { inp.checked = ev.target.checked; });
    };
    basicWrap.querySelectorAll("[data-basic]").forEach((inp) => {
      inp.addEventListener("change", () => {
        draft.basic[inp.dataset.basic] = inp.checked;
        selectAll.checked = BASIC_FIELDS.every((f) => draft.basic[f.key]);
      });
    });
    const typeList = document.getElementById("custom-type-list");
    const types = Object.keys(CUSTOM_FIELDS_BY_OBJECT);
    let activeType = types[0];
    function renderCustomFields(type) {
      activeType = type;
      typeList.querySelectorAll(".custom-type-item").forEach((el) => el.classList.toggle("active", el.dataset.type === type));
      const wrap = document.getElementById("custom-field-checks");
      const fields = CUSTOM_FIELDS_BY_OBJECT[type] || [];
      wrap.innerHTML = fields.length
        ? fields.map((f) => `
            <label>
              <input type="checkbox" data-custom="${f}" data-otype="${type}" ${draft.custom[type] && draft.custom[type][f] ? "checked" : ""} />
              <span>${f}</span>
            </label>
          `).join("")
        : `<span class="custom-field-empty">无自定义字段</span>`;
      wrap.querySelectorAll("[data-custom]").forEach((inp) => {
        inp.addEventListener("change", () => {
          if (!draft.custom[inp.dataset.otype]) draft.custom[inp.dataset.otype] = {};
          draft.custom[inp.dataset.otype][inp.dataset.custom] = inp.checked;
        });
      });
    }
    typeList.innerHTML = types.map((t) =>
      `<div class="custom-type-item${t === activeType ? " active" : ""}" data-type="${t}" title="${t}">${t}</div>`
    ).join("");
    typeList.querySelectorAll(".custom-type-item").forEach((el) => {
      el.addEventListener("click", () => renderCustomFields(el.dataset.type));
    });
    renderCustomFields(activeType);
  }

  function setupSettings() {
    const overlay = document.getElementById("settings-modal-overlay");
    const closeModal = () => overlay.classList.remove("open");
    document.getElementById("settings-btn").addEventListener("click", () => {
      state.settingsDraft = JSON.parse(JSON.stringify(state.fieldSettings));
      renderSettingsModal(state.settingsDraft);
      overlay.classList.add("open");
    });
    document.getElementById("settings-close").addEventListener("click", closeModal);
    document.getElementById("settings-cancel").addEventListener("click", closeModal);
    overlay.addEventListener("click", (ev) => { if (ev.target === overlay) closeModal(); });
    overlay.querySelector(".settings-modal").addEventListener("click", (ev) => ev.stopPropagation());
    document.getElementById("settings-reset").addEventListener("click", () => {
      state.settingsDraft = defaultFieldSettings();
      renderSettingsModal(state.settingsDraft);
    });
    document.getElementById("settings-confirm").addEventListener("click", () => {
      saveFieldSettings(state.settingsDraft);
      closeModal();
      nodes.forEach((n) => updateNodeEl(n));
    });
  }

  function setupZoomControls() {
    document.getElementById("zoom-in").addEventListener("click", () => {
      const next = ZOOM_PRESETS.find((z) => z > view.scale + 0.001) ?? Math.min(view.max, view.scale + view.step);
      setZoom(next);
    });
    document.getElementById("zoom-out").addEventListener("click", () => {
      const prevs = ZOOM_PRESETS.filter((z) => z < view.scale - 0.001);
      setZoom(prevs.length ? prevs[prevs.length - 1] : Math.max(view.min, view.scale - view.step));
    });
    document.getElementById("zoom-fit").addEventListener("click", beautifyLayout);
    const fsBtn = document.getElementById("zoom-fullscreen");
    const isFs = () => (document.fullscreenElement || document.webkitFullscreenElement) === map;
    const updFs = () => fsBtn.classList.toggle("is-fullscreen", isFs());
    fsBtn.addEventListener("click", async () => {
      try {
        if (isFs()) { if (document.exitFullscreen) await document.exitFullscreen(); else document.webkitExitFullscreen(); }
        else { if (map.requestFullscreen) await map.requestFullscreen(); else map.webkitRequestFullscreen(); }
      } catch (_) {}
      updFs();
    });
    document.addEventListener("fullscreenchange", updFs);
    const zoomPctBtn = document.getElementById("zoom-pct");
    const zoomMenu = document.getElementById("zoom-menu");
    zoomPctBtn.addEventListener("click", (ev) => { ev.stopPropagation(); zoomMenu.classList.toggle("open"); });
    zoomMenu.querySelectorAll(".filter-option").forEach((opt) => {
      opt.addEventListener("click", (ev) => { ev.stopPropagation(); setZoom(Number(opt.dataset.zoom)); zoomMenu.classList.remove("open"); });
    });
    map.addEventListener("wheel", (ev) => {
      if (ev.target.closest(".filter-bar, .zoom-bar, .edge-legend, .node-popover, .modal-overlay")) return;
      ev.preventDefault();
      setZoom(view.scale + (ev.deltaY > 0 ? -view.step : view.step), ev.clientX, ev.clientY);
    }, { passive: false });
    updFs();
  }

  function setupPan() {
    let panning = false, sx, sy, ox, oy;
    map.addEventListener("pointerdown", (ev) => {
      if (ev.button !== 0) return;
      if (ev.target.closest(".node, .filter-bar, .zoom-bar, .edge-legend, .filter-menu, .zoom-menu, .node-popover, .type-filter-popover, .modal-overlay")) return;
      hidePopover();
      clearSelectedNode();
      panning = true;
      map.setPointerCapture(ev.pointerId);
      sx = ev.clientX; sy = ev.clientY; ox = view.panX; oy = view.panY;
      map.style.cursor = "grabbing";
    });
    map.addEventListener("pointermove", (ev) => {
      if (!panning) return;
      view.panX = ox + (ev.clientX - sx);
      view.panY = oy + (ev.clientY - sy);
      applyViewTransform();
    });
    const end = () => { panning = false; map.style.cursor = ""; };
    map.addEventListener("pointerup", end);
    map.addEventListener("pointercancel", end);
  }

  document.addEventListener("click", () => {
    document.getElementById("relation-menu").classList.remove("open");
    document.getElementById("type-filter-popover").classList.remove("open");
    document.getElementById("zoom-menu").classList.remove("open");
  });
  document.getElementById("filter-bar").addEventListener("click", (ev) => ev.stopPropagation());
  document.querySelector(".zoom-bar").addEventListener("click", (ev) => ev.stopPropagation());

  setupFilters();
  setupTypeFilter();
  setupSettings();
  setupZoomControls();
  setupPan();

  // 穿透按钮：舞台级委托，避免 innerHTML 重绘丢监听
  stage.addEventListener("click", (ev) => {
    const btn = ev.target.closest(".expand-btn");
    if (!btn || !btn.classList.contains("show")) return;
    ev.preventDefault();
    ev.stopPropagation();
    expandLayer(btn.dataset.dir === "back" ? "back" : "fwd");
  });

  refreshGraph();
  // 进入页面默认按节点真实高度美化排布一次
  requestAnimationFrame(() => beautifyLayout());
  window.addEventListener("resize", () => { drawEdges(); if (state.activePopoverId) positionPopover(nodeEls[state.activePopoverId]); });
})();
  </script>
</body>
</html>
